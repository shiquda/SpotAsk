name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish or replace
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    environment: release
    env:
      SPOTASK_CODESIGN_IDENTITY: ${{ secrets.SPOTASK_CODESIGN_IDENTITY }}
      SPOTASK_REQUIRE_DEVELOPER_ID: ${{ secrets.SPOTASK_REQUIRE_DEVELOPER_ID }}
      SPOTASK_REQUIRE_NOTARIZATION: ${{ secrets.SPOTASK_REQUIRE_NOTARIZATION }}
      SPOTASK_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.SPOTASK_NOTARY_KEYCHAIN_PROFILE }}
      SPOTASK_NOTARY_KEYCHAIN: ${{ secrets.SPOTASK_NOTARY_KEYCHAIN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Resolve release tag
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag=$REQUESTED_TAG
          else
            release_tag=$GITHUB_REF_NAME
          fi
          case "$release_tag" in
            v*) ;;
            *) echo "Release tag must start with v" >&2; exit 1 ;;
          esac
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
      - name: Confirm release tag matches the app version
        run: |
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          tag_version=${RELEASE_TAG#v}
          test "$tag_version" = "$app_version"
      - name: Build arm64 DMG
        run: ./Scripts/make-release-dmg.sh --arch arm64 --output dist
      - name: Build x86_64 DMG
        run: ./Scripts/make-release-dmg.sh --arch x86_64 --output dist
      - name: Create checksums
        run: shasum -a 256 dist/*.dmg > "dist/SpotAsk-${RELEASE_TAG}-SHA256SUMS.txt"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --generate-notes
          fi
