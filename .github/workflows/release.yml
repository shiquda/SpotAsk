name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to publish or replace
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    environment: release
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      SPOTASK_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARIZATION_APPLE_ID }}
      SPOTASK_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARIZATION_TEAM_ID }}
      SPOTASK_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Resolve release tag
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag=$REQUESTED_TAG
          else
            release_tag=$GITHUB_REF_NAME
          fi
          case "$release_tag" in
            v*) ;;
            *) echo "Release tag must start with v" >&2; exit 1 ;;
          esac
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
      - name: Confirm release tag matches the app version
        run: |
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          tag_version=${RELEASE_TAG#v}
          test "$tag_version" = "$app_version"
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
      - name: Configure Apple Developer signing
        run: |
          set -eu
          test -n "$APPLE_CERTIFICATE_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$SPOTASK_NOTARY_APPLE_ID"
          test -n "$SPOTASK_NOTARY_TEAM_ID"
          test -n "$SPOTASK_NOTARY_PASSWORD"

          KEYCHAIN_PATH="$RUNNER_TEMP/spotask-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          P12_PATH="$RUNNER_TEMP/DeveloperID.p12"

          printf '%s\n' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security import "$P12_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$P12_PATH"

          security find-identity -v -p codesigning
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning \
            | sed -n 's/^[[:space:]]*[0-9][0-9]*)[[:space:]]*[0-9A-Fa-f]*[[:space:]]*"\(.*\)".*/\1/p' \
            | grep 'Developer ID Application' \
            | head -n 1)
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "No Developer ID Application identity found in the imported certificate" >&2
            exit 1
          fi

          echo "SPOTASK_CODESIGN_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "SPOTASK_REQUIRE_DEVELOPER_ID=1" >> "$GITHUB_ENV"
          echo "SPOTASK_REQUIRE_NOTARIZATION=0" >> "$GITHUB_ENV"
      - name: Build arm64 DMG
        run: ./Scripts/make-release-dmg.sh --arch arm64 --output dist
      - name: Build x86_64 DMG
        run: ./Scripts/make-release-dmg.sh --arch x86_64 --output dist
      - name: Notarize and staple DMGs
        run: |
          set -euo pipefail
          arm64_dmg="dist/SpotAsk-${APP_VERSION}-arm64.dmg"
          x86_64_dmg="dist/SpotAsk-${APP_VERSION}-x86_64.dmg"

          echo "Submitting DMGs to Apple Notary Service..."
          ./Scripts/notarize-dmg.sh submit "$arm64_dmg" --wait &
          pid_arm64=$!
          ./Scripts/notarize-dmg.sh submit "$x86_64_dmg" --wait &
          pid_x86_64=$!

          wait "$pid_arm64"
          wait "$pid_x86_64"

          echo "Stapling notarization tickets..."
          ./Scripts/notarize-dmg.sh staple "$arm64_dmg"
          ./Scripts/notarize-dmg.sh staple "$x86_64_dmg"
      - name: Create checksums
        run: shasum -a 256 dist/*.dmg > "dist/SpotAsk-${RELEASE_TAG}-SHA256SUMS.txt"
      - name: Generate release notes from CHANGELOG
        run: |
          set -eu
          ./Scripts/release-notes-from-changelog.sh "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          echo "RELEASE_NOTES_FILE=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RELEASE_NOTES_FILE" --draft=false
            gh release upload "$RELEASE_TAG" \
              "dist/SpotAsk-${APP_VERSION}-arm64.dmg" \
              "dist/SpotAsk-${APP_VERSION}-x86_64.dmg" \
              "dist/SpotAsk-${RELEASE_TAG}-SHA256SUMS.txt" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "dist/SpotAsk-${APP_VERSION}-arm64.dmg" \
              "dist/SpotAsk-${APP_VERSION}-x86_64.dmg" \
              "dist/SpotAsk-${RELEASE_TAG}-SHA256SUMS.txt" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES_FILE"
          fi
      - name: Update Homebrew Cask
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=${APP_VERSION}

          arm64_dmg="dist/SpotAsk-${version}-arm64.dmg"
          x86_64_dmg="dist/SpotAsk-${version}-x86_64.dmg"
          test -f "$arm64_dmg"
          test -f "$x86_64_dmg"
          arm64_sha=$(shasum -a 256 "$arm64_dmg" | awk '{print $1}')
          x86_64_sha=$(shasum -a 256 "$x86_64_dmg" | awk '{print $1}')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          cat > Casks/spotask.rb <<EOF
          cask "spotask" do
            version "${version}"

            on_arm do
              sha256 "${arm64_sha}"

              url "https://github.com/shiquda/SpotAsk/releases/download/v#{version}/SpotAsk-#{version}-arm64.dmg"
            end
            on_intel do
              sha256 "${x86_64_sha}"

              url "https://github.com/shiquda/SpotAsk/releases/download/v#{version}/SpotAsk-#{version}-x86_64.dmg"
            end

            name "SpotAsk"
            desc "Ask an AI assistant from your menu bar"
            homepage "https://github.com/shiquda/SpotAsk"

            depends_on macos: :sequoia

            app "SpotAsk.app"
          end
          EOF

          git add Casks/spotask.rb
          if git diff --cached --quiet; then
            echo "Casks/spotask.rb is already up to date."
            exit 0
          fi
          git commit -m "chore: update Homebrew cask for ${RELEASE_TAG}"
          git push origin HEAD:main
