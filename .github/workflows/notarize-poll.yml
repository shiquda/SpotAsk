name: Release - Poll Notarization

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: release-notarize-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: macos-26
    environment: release
    env:
      SPOTASK_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARIZATION_APPLE_ID }}
      SPOTASK_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARIZATION_TEAM_ID }}
      SPOTASK_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Poll pending draft releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          pending_tag=""
          while read -r candidate_tag; do
            [ -z "$candidate_tag" ] && continue
            marker_count=$(gh release view "$candidate_tag" --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '[.assets[].name | select(startswith("notary-") and endswith(".json"))] | length' \
              2>/dev/null || echo 0)
            if [ "$marker_count" -gt 0 ]; then
              pending_tag="$candidate_tag"
              break
            fi
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
            --json tagName,isDraft \
            --jq '.[] | select(.isDraft) | .tagName')

          if [ -z "$pending_tag" ]; then
            gh workflow disable notarize-poll.yml --repo "$GITHUB_REPOSITORY" || true
            echo "No draft releases awaiting notarization; poll workflow is now disabled."
            exit 0
          fi

          echo "Polling $pending_tag"
          poll_dir="$RUNNER_TEMP/poll-$pending_tag"
          mkdir -p "$poll_dir"
          gh release download "$pending_tag" --repo "$GITHUB_REPOSITORY" \
            --dir "$poll_dir" \
            --pattern 'notary-*.json'

          test -f "$poll_dir/notary-arm64.json"
          test -f "$poll_dir/notary-x86_64.json"

          pending=0
          for marker in "$poll_dir"/notary-*.json; do
            [ -f "$marker" ] || continue
            submission_id=$(jq -er '.submission_id' "$marker")
            architecture=$(jq -er '.architecture' "$marker")
            status=$(./Scripts/notarize-dmg.sh info "$submission_id" | jq -er '.status')
            echo "$pending_tag $architecture: $status"
            case "$status" in
              Accepted) ;;
              In\ Progress) pending=1 ;;
              *)
                echo "Notarization failed for $architecture ($submission_id)" >&2
                ./Scripts/notarize-dmg.sh log "$submission_id" "$RUNNER_TEMP/notary-$architecture.log" || true
                cat "$RUNNER_TEMP/notary-$architecture.log" 2>/dev/null || true
                exit 1
                ;;
            esac
          done

          if [ "$pending" -eq 1 ]; then
            echo "$pending_tag is still processing; it will be checked again later."
            exit 0
          fi

          marker_count=$(gh release view "$pending_tag" --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '[.assets[].name | select(startswith("notary-") and endswith(".json"))] | length' \
            2>/dev/null || echo 0)
          if [ "$marker_count" -lt 2 ]; then
            echo "$pending_tag was finalized or its markers were removed; skipping dispatch."
            exit 0
          fi

          echo "All submissions Accepted; dispatching finalize workflow."
          gh workflow run release-finalize.yml --repo "$GITHUB_REPOSITORY" \
            --field release_tag="$pending_tag"
